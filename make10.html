<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make10 アプリ</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --gray: #64748b;
            --border: #cbd5e1;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 20px;
            font-size: 1.8rem;
        }

        /* タブ切り替え */
        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #e2e8f0;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            color: var(--gray);
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab-btn.active {
            color: var(--primary);
            border-bottom: 3px solid var(--primary);
            margin-bottom: -2px;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        /* 共通パーツ */
        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: #e2e8f0;
            color: var(--text-color);
            margin-top: 5px;
        }
        .btn-secondary:hover {
            background-color: #cbd5e1;
        }

        /* 遊ぶモード */
        .number-pool {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .tile {
            width: 50px;
            height: 50px;
            background: #f1f5f9;
            border: 2px solid var(--border);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            font-weight: bold;
            cursor: grab;
            user-select: none;
            transition: transform 0.1s;
        }
        .tile:active {
            cursor: grabbing;
        }

        .operator-pool {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
            margin-bottom: 20px;
        }

        .op-btn {
            background: #ede9fe;
            color: var(--primary);
            border: 1px solid #c7d2fe;
            padding: 10px 0;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            user-select: none;
        }
        .op-btn:hover {
            background: #ddd6fe;
        }

        .drop-zone {
            min-height: 60px;
            border: 2px dashed var(--border);
            border-radius: 10px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            padding: 8px;
            gap: 6px;
            margin-bottom: 15px;
            background: #fafafa;
        }

        .expression-item {
            background: white;
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .expression-item .remove {
            color: #ef4444;
            cursor: pointer;
            font-size: 0.9rem;
            margin-left: 4px;
        }

        .result-msg {
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 15px;
            min-height: 30px;
        }

        /* 探すモード */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .input-group input {
            flex: 1;
            padding: 10px;
            font-size: 1.1rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            text-align: center;
        }

        .answer-list {
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            background: #fafafa;
            margin-top: 15px;
        }

        .answer-item {
            padding: 8px 12px;
            border-bottom: 1px solid #e2e8f0;
            font-family: monospace;
            font-size: 1.1rem;
        }
        .answer-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Make 10</h1>
    
    <!-- タブメニュー -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('play')">遊ぶ (ランダム)</button>
        <button class="tab-btn" onclick="switchTab('search')">探す (自動解答)</button>
    </div>

    <!-- 1つ目: 遊ぶセクション -->
    <div id="play-section" class="section active">
        <p style="text-align: center; color: var(--gray); font-size: 0.9rem;">数字タイルや演算子をクリックして数式を作ろう！</p>
        
        <div class="number-pool" id="number-pool">
            <!-- 動的生成 -->
        </div>

        <div class="operator-pool">
            <div class="op-btn" onclick="addExpression('+')">+</div>
            <div class="op-btn" onclick="addExpression('-')">-</div>
            <div class="op-btn" onclick="addExpression('*')">×</div>
            <div class="op-btn" onclick="addExpression('/')">÷</div>
            <div class="op-btn" onclick="addExpression('(')">(</div>
            <div class="op-btn" onclick="addExpression(')')">)</div>
        </div>

        <div class="drop-zone" id="drop-zone" placeholder="ここに数式が組み立てられます">
            <span style="color: var(--gray); font-size: 0.9rem;" id="placeholder-text">ここをクリックまたはタップで数式を追加</span>
        </div>

        <button class="btn" onclick="checkAnswer()">判定する (=10？)</button>
        <button class="btn btn-secondary" onclick="initPlayMode()">次の問題</button>

        <div class="result-msg" id="play-result"></div>
    </div>

    <!-- 2つ目: 探すセクション -->
    <div id="search-section" class="section">
        <p style="text-align: center; color: var(--gray); font-size: 0.9rem;">4つの数字を入力すると、10になる数式をすべて探します。</p>
        
        <div class="input-group">
            <input type="number" id="s1" min="0" max="9" value="1">
            <input type="number" id="s2" min="0" max="9" value="2">
            <input type="number" id="s3" min="0" max="9" value="3">
            <input type="number" id="s4" min="0" max="9" value="4">
        </div>

        <button class="btn" onclick="searchAnswers()">答えを探す</button>

        <div class="answer-list" id="answer-list">
            <div style="color: var(--gray); text-align: center; padding: 20px;">ここに結果が表示されます</div>
        </div>
    </div>
</div>

<script>
    // タブ切り替え
    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));

        if (tabName === 'play') {
            document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
            document.getElementById('play-section').classList.add('active');
        } else {
            document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
            document.getElementById('search-section').classList.add('active');
        }
    }

    // --- 【遊ぶモードのロジック】 ---
    let currentNumbers = [];
    let currentExpression = []; // 数式要素の配列

    function initPlayMode() {
        // 1〜9からランダムに4つ選択（解が存在しやすいように簡易ランダム）
        currentNumbers = [];
        for (let i = 0; i < 4; i++) {
            currentNumbers.push(Math.floor(Math.random() * 9) + 1);
        }
        currentExpression = [];
        renderPlayBoard();
        document.getElementById('play-result').textContent = '';
    }

    function renderPlayBoard() {
        const pool = document.getElementById('number-pool');
        pool.innerHTML = '';
        currentNumbersforEach = {};
        
        // 数字プール表示（使ったかどうかを追跡できるようにする）
        currentNumbers.forEach((num, index) => {
            const tile = document.createElement('div');
            tile.className = 'tile';
            tile.textContent = num;
            tile.onclick = () => addNumberToExpression(num, index, tile);
            pool.appendChild(tile);
        });

        renderExpression();
    }

    function addNumberToExpression(num, index, tileElement) {
        // 数字は各タイル1回ずつしか使えないルールに制限
        currentExpression.push({ type: 'num', val: num, index: index });
        tileElement.style.opacity = '0.3';
        tileElement.style.pointerEvents = 'none';
        renderExpression();
    }

    function addExpression(val) {
        currentExpression.push({ type: 'op', val: val });
        renderExpression();
    }

    function renderExpression() {
        const zone = document.getElementById('drop-zone');
        zone.innerHTML = '';

        if (currentExpression.length === 0) {
            zone.innerHTML = '<span style="color: var(--gray); font-size: 0.9rem;">ここをクリックまたはタップで数式を追加</span>';
            return;
        }

        currentExpression.forEach((item, idx) => {
            const span = document.createElement('div');
            span.className = 'expression-item';
            let displayVal = item.val;
            if (displayVal === '*') displayVal = '×';
            if (displayVal === '/') displayVal = '÷';
            
            span.innerHTML = `${displayVal} <span class="remove" onclick="removeExpression(${idx})">&times;</span>`;
            zone.appendChild(span);
        });
    }

    function removeExpression(idx) {
        const removed = currentExpression.splice(idx, 1)[0];
        if (removed.type === 'num') {
            // 数字タイルを復元
            renderPlayBoard();
            // 一旦クリアして再描画した方が安全なのでシンプルに再描画
            // 簡易的にプールを再構築
        }
        renderPlayBoard();
        // 削除時はプール状態を復元するために再レンダリング
        // 厳密なプール復元：
        refreshPoolState();
    }

    function refreshPoolState() {
        const usedIndices = currentExpression.filter(i => i.type === 'num').map(i => i.index);
        const tiles = document.querySelectorAll('#number-pool .tile');
        tiles.forEach((tile, idx) => {
            if (usedIndices.includes(idx)) {
                tile.style.opacity = '0.3';
                tile.style.pointerEvents = 'none';
            } else {
                tile.style.opacity = '1';
                tile.style.pointerEvents = 'auto';
            }
        });
        renderExpression();
    }

    // 演算子追加時のプール状態更新用ラッパー
    const originalAddExpression = addExpression;
    window.addExpression = function(val) {
        currentExpression.push({ type: 'op', val: val });
        renderExpression();
    };

    // 数字タイルのクリック挙動を上書き調整
    window.addNumberToExpression = function(num, index, tileElement) {
        // 既に使われているか確認
        if (currentExpression.some(i => i.type === 'num' && i.index === index)) return;
        currentExpression.push({ type: 'num', val: num, index: index });
        refreshPoolState();
    }

    function removeExpression(idx) {
        currentExpression.splice(idx, 1);
        refreshPoolState();
    }

    function checkAnswer() {
        const resultMsg = document.getElementById('play-result');
        // 全ての数字を使ったかチェック
        const usedNums = currentExpression.filter(i => i.type === 'num');
        if (usedNums.length !== 4) {
            resultMsg.style.color = '#ef4444';
            resultMsg.textContent = '4つの数字すべてを使ってください！';
            return;
        }

        const exprStr = currentExpression.map(i => i.val).join('');
        try {
            // 安全な計算評価
            const ans = Function('"use strict";return (' + exprStr + ')')();
            if (Math.abs(ans - 10) < 1e-5) {
                resultMsg.style.color = '#22c55e';
                resultMsg.textContent = '🎉 正解です！お見事！';
            } else {
                resultMsg.style.color = '#ef4444';
                resultMsg.textContent = `残念！ 計算結果は ${ans} です。`;
            }
        } catch (e) {
            resultMsg.style.color = '#ef4444';
            resultMsg.textContent = '数式の形式が正しくありません。';
        }
    }


    // --- 【探すモードのロジック（自動計算）】 ---
    function searchAnswers() {
        const n1 = parseInt(document.getElementById('s1').value);
        const n2 = parseInt(document.getElementById('s2').value);
        const n3 = parseInt(document.getElementById('s3').value);
        const n4 = parseInt(document.getElementById('s4').value);

        const nums = [n1, n2, n3, n4];
        const listContainer = document.getElementById('answer-list');
        listContainer.innerHTML = '<div style="text-align: center; padding: 10px; color: var(--gray);">計算中...</div>';

        setTimeout(() => {
            const answers = findAllMake10(nums);
            listContainer.innerHTML = '';

            if (answers.length === 0) {
                listContainer.innerHTML = '<div style="color: #ef4444; text-align: center; padding: 20px;">10にできる組み合わせはありませんでした。</div>';
                return;
            }

            answers.forEach(ans => {
                const div = document.createElement('div');
                div.className = 'answer-item';
                div.textContent = ans.replace(/\*/g, '×').replace(/\//g, '÷') + ' = 10';
                listContainer.appendChild(div);
            });
        }, 50);
    }

    // 順列生成ヘルパー
    function permute(arr) {
        if (arr.length <= 1) return [arr];
        let res = [];
        for (let i = 0; i < arr.length; i++) {
            let current = arr[i];
            let remaining = arr.slice(0, i).concat(arr.slice(i + 1));
            let remainingPerms = permute(remaining);
            for (let p of remainingPerms) {
                res.push([current].concat(p));
            }
        }
        return res;
    }

    // 4つの数字と演算子のパターンからMake10を全探索
    function findAllMake10(nums) {
        let results = new Set();
        const ops = ['+', '-', '*', '/'];
        const numPerms = permute(nums);

        // 括弧のパターンのテンプレート（a, b, c, d は数字、opは演算子）
        // 5種類の基本的な括弧の構造
        const patterns = [
            (a,b,c,d,o1,o2,o3) => `${a} ${o1} ${b} ${o2} ${c} ${o3} ${d}`,
            (a,b,c,d,o1,o2,o3) => `(${a} ${o1} ${b}) ${o2} ${c} ${o3} ${d}`,
            (a,b,c,d,o1,o2,o3) => `${a} ${o1} (${b} ${o2} ${c}) ${o3} ${d}`,
            (a,b,c,d,o1,o2,o3) => `${a} ${o1} ${b} ${o2} (${c} ${o3} ${d})`,
            (a,b,c,d,o1,o2,o3) => `(${a} ${o1} ${b} ${o2} ${c}) ${o3} ${d}`,
            (a,b,c,d,o1,o2,o3) => `${a} ${o1} (${b} ${o2} ${c} ${o3} ${d})`,
            (a,b,c,d,o1,o2,o3) => `(${a} ${o1} ${b}) ${o2} (${c} ${o3} ${d})`,
            (a,b,c,d,o1,o2,o3) => `((${a} ${o1} ${b}) ${o2} ${c}) ${o3} ${d}`,
            (a,b,c,d,o1,o2,o3) => `${a} ${o1} ((${b} ${o2} ${c}) ${o3} ${d})`
        ];

        for (let p of numPerms) {
            let [a, b, c, d] = p;
            for (let o1 of ops) {
                for (let o2 of ops) {
                    for (let o3 of ops) {
                        for (let fn of patterns) {
                            let expr = fn(a, b, c, d, o1, o2, o3);
                            try {
                                let val = Function('"use strict";return (' + expr + ')')();
                                if (Math.abs(val - 10) < 1e-5) {
                                    results.add(expr);
                                }
                            } catch (e) {
                                // ゼロ除算などのエラーは無視
                            }
                        }
                    }
                }
            }
        }
        return Array.from(results);
    }

    // 初期化実行
    initPlayMode();
</script>

</body>
</html>
